media:
  input: "imagenes"
  output: "/imagenes"

content:
  - name: productos
    label: "Mis Productos"
    type: file
    path: "productos.json"
    format: json
    fields:
      - name: productos_lista
        label: "Lista de Productos"
        type: object
        list: true
        fields:
          - { name: id, label: "ID Único (Número)", type: number }
          - { name: nombre, label: "Nombre de la Gelatina", type: string }
          - { name: categoria, label: "Categoría", type: string }
          - { name: descripcion, label: "Descripción", type: text }
          - { name: precio, label: "Precio Venta (S/)", type: number }
          - { name: descuento, label: "Precio Anterior (S/)", type: number }
          - { name: imagen, label: "Foto de la Gelatina", type: image }
